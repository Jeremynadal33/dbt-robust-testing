[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-robust-testing"
version = "0.1.0"
description = "dbt Devoxx Workshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.9.3",
    "dbt-duckdb>=1.9.2",
    "duckdb>=1.2.1",
    "pandas>=2.2.3",
]
